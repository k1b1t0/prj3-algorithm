[project]
name = "prj3-algorithm"
version = "0.1.0"
description = "Vulnerability scheduling algorithm via ESSC + Hungarian + DP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "ortools>=9.15.6755",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
